name: "Push to DevOps Repo"
description: "Updates deployment files and pushes to DevOps repository"

inputs:
    environment:
        description: "Deployment environment"
        required: true
    devops_repo_token:
        description: "Token for the DevOps repository"
        required: true

runs:
    using: "composite"
    steps:
        -   name: Checkout code
            uses: actions/checkout@v4

        -   name: Configure Git
            run: |
                git config --global user.name "GitHub Actions Bot"
                git config --global user.email "actions@github.com"
            shell: bash

        -   name: Replace image tags in deployment files
            run: |
                # Update evaluation deployment
                if [ -f "k8s/evaluation/${{ inputs.environment }}/deployment.yaml" ]; then
                    sed -i "s/\${GITHUB_SHA}/${{ github.sha }}/g" k8s/evaluation/${{ inputs.environment }}/deployment.yaml
                fi
                
                # Update tournament deployment
                if [ -f "k8s/tournament/${{ inputs.environment }}/deployment.yaml" ]; then
                    sed -i "s/\${GITHUB_SHA}/${{ github.sha }}/g" k8s/tournament/${{ inputs.environment }}/deployment.yaml
                fi
            shell: bash

        -   name: Commit changes
            run: |
                git add k8s/evaluation/${{ inputs.environment }}/* k8s/tournament/${{ inputs.environment }}/*
                git commit -m "${{ github.sha }}"
            shell: bash

        -   name: Checkout DevOps
            uses: actions/checkout@v4
            with:
                repository: "rhaversen/DevOps"
                token: ${{ inputs.devops_repo_token }}
                path: "DevOps"

        -   name: Copy files to DevOps
            run: |
                # Copy evaluation files
                mkdir -p DevOps/GaslightCodeRunner/evaluation/${{ inputs.environment }}
                cp -r k8s/evaluation/${{ inputs.environment }}/* DevOps/GaslightCodeRunner/evaluation/${{ inputs.environment }}/
                
                # Copy tournament files
                mkdir -p DevOps/GaslightCodeRunner/tournament/${{ inputs.environment }}
                cp -r k8s/tournament/${{ inputs.environment }}/* DevOps/GaslightCodeRunner/tournament/${{ inputs.environment }}/
            shell: bash

        -   name: Push changes to DevOps
            run: |
                cd DevOps
                git add GaslightCodeRunner/evaluation/${{ inputs.environment }}/* GaslightCodeRunner/tournament/${{ inputs.environment }}/*
                git commit -m "GaslightCodeRunner/${{ inputs.environment }}: ${{ github.sha }}"
                git push origin HEAD
            shell: bash
